name: Verify
on:
  # PR branches are verified by their pull_request run; push covers main only.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # On main, looks for a passing pull request run that already tested this exact
  # tree. Each run's `check` job uploads its build as `dist-<tree>`; a pull request
  # run tests the merge of its head into main, so a squash merge made before main
  # moves on yields the same tree. When one is found, the tests are skipped and
  # `deploy` publishes that run's build; otherwise the full suite runs here. Only
  # runs from this repository count, so a fork cannot supply a build.
  reuse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      tree: ${{ steps.find.outputs.tree }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$GH_REPO/commits/$SHA" --jq .commit.tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          runs=$(gh api "repos/$GH_REPO/actions/artifacts?name=dist-$tree&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')
          for run in $runs; do
            passed=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq 'select(
              .event == "pull_request" and .conclusion == "success" and
              .head_repository.full_name == env.GH_REPO and
              .path == ".github/workflows/ci.yml") | .html_url')
            if [ -n "$passed" ]; then
              echo "Tree $tree passed in $passed; deploying that build."
              echo "run-id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing pull request run tested tree $tree; running the full suite."

  check:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest release, so the deployed engine.wasm always has current Go security
          # fixes. go.mod's `go` line is the minimum supported toolchain.
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make check
      - id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # Pull request runs upload too, so main can deploy a build that already passed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ steps.tree.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The Chromium suite, split across runners. Each shard builds its own copy of
  # the production app, which takes seconds, rather than waiting on `check`.
  # Shards get whole spec files, so they are uneven; six keep the slowest near
  # the `check` and `webkit` jobs while setup stays a small share of each.
  browser:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    name: chromium (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Each shard takes about 10 minutes, and 15 on a slow day.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make build
      # Chromium's packages and ffmpeg's (~50, for ffprobe, which independently
      # decodes exported MP4 files in the browser tests) come from the runner
      # image's Ubuntu mirror, which has stalled at ~40 KB/s long enough to
      # time a shard out. The downloaded packages are cached per runner image
      # and Playwright version, so a warm shard installs them from the cache
      # with no download. A pull request reads only its own caches and main's,
      # so after the image or Playwright changes it falls back to the newest
      # archive for the same OS, usually main's: apt then downloads only the
      # packages that have changed, and the job saves the archive under the
      # new key. ImageOS and ImageVersion are the runner's environment, not the
      # `env` context, so the keys are written from the shell.
      - id: apt
        run: |
          playwright=$(npx playwright --version | cut -d' ' -f2)
          echo "prefix=apt-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=apt-$ImageOS-$ImageVersion-playwright-$playwright" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}
      # The script cuts off and retries a stalled install; this is the backstop.
      - name: Install Chromium
        timeout-minutes: 8
        run: APT_ARCHIVES="$HOME/apt-archives" .github/scripts/install-chromium.sh
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          # Installing Chromium refreshed the package lists and pointed apt at
          # the cached archive.
          sudo apt-get install -y --no-install-recommends ffmpeg
          # Drop packages from an older image or Playwright that apt no
          # longer lists, so the archive does not grow with every image.
          sudo apt-get autoclean
          # apt leaves the archive root-owned; the cache is saved as the runner.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      # Runs against the production build in dist/, under the production CSP.
      # TEST_SHARD packs the shards by each spec file's recorded duration
      # (tests/shards.ts, tests/test-durations.json), not by test count as
      # --shard does. The JSON report records each test's duration, which the
      # dot reporter does not, so a slow or slowing shard can be compared
      # test by test with another run's, and the recorded durations refreshed
      # from several runs (`make test-durations RUN="<run id>..."`).
      - run: npx playwright test --reporter=dot,json
        env:
          TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-timings.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-test-timings-${{ matrix.shard }}
          path: test-timings.json
          if-no-files-found: ignore
          retention-days: 30

  # Safari's engine, which every iOS browser also uses: no canvas WebP, and its
  # own H.264 encoder and VideoFrame behavior. Standard macOS runners are free
  # for public repositories. Runs WebKit and shared mobile-input checks.
  webkit:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: npx playwright install webkit
      # ffprobe independently decodes the exported MP4 files.
      - run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
      - run: make test-webkit
      # A "Page crashed" failure leaves no trace in the log. macOS writes the
      # WebContent crash or jetsam (memory) report here, which tells an engine
      # crash from memory pressure on the runner.
      - if: failure()
        run: |
          mkdir -p test-results/crash-reports
          for dir in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            find "$dir" -maxdepth 1 -type f -mmin -30 \( -name '*WebKit*' -o -name '*WebContent*' -o -name 'JetsamEvent*' -o -name '*pw_run*' \) \
              -exec cp {} test-results/crash-reports/ \; 2>/dev/null || true
          done
          ls -la test-results/crash-reports
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The one required status check. Every test job must pass, except on main when
  # `reuse` found a passing run of this exact tree and the tests were skipped.
  verify:
    needs: [reuse, check, browser, webkit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          REUSED: ${{ needs.reuse.outputs.run-id }}
          RESULTS: ${{ needs.check.result }} ${{ needs.browser.result }} ${{ needs.webkit.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) test -n "$REUSED" || { echo "::error::A test job was skipped."; exit 1; } ;;
              *) echo "::error::A test job finished with: $result"; exit 1 ;;
            esac
          done

  # Publishes the exact build that passed `verify`, from this run or from the pull
  # request run `reuse` found. Hosting is managed in iwvelando/cloud-accounts
  # (sites/tangent-garden.isaacvelando.com). Only this job can get AWS credentials,
  # and the `production` environment only allows main.
  deploy:
    needs: [reuse, check, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tangent-garden.isaacvelando.com
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE_ARN: arn:aws:iam::634753796535:role/tangent-garden-deploy
      BUCKET: tangent-garden-site-634753796535
      DISTRIBUTION_ID: E1T03M5KK77GZX
      SITE_URL: https://tangent-garden.isaacvelando.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ needs.check.outputs.tree || needs.reuse.outputs.tree }}
          path: dist
          run-id: ${{ needs.reuse.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      # `sync --delete` below would wipe the site if the build came out empty.
      - name: sanity-check build
        run: |
          for f in index.html 404.html engine.wasm wasm_exec.js; do test -s "dist/$f"; done
          ls dist/assets/*.js

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fingerprinted assets first, so the new index.html never references a missing
      # file. Old assets are kept for pages that were already open during a deploy.
      - name: upload
        run: |
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/engine.wasm "s3://$BUCKET/engine.wasm" \
            --content-type application/wasm --cache-control 'public, max-age=300'
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude 'assets/*' --exclude 'engine.wasm' \
            --cache-control 'public, max-age=300'

      - name: invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: check headers
        run: |
          header() { curl -fsSI "$SITE_URL$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          if [ "$(header / content-security-policy)" != "$(tr -d '\n' < deploy/content-security-policy.txt)" ]; then
            echo "::error::The live CSP differs from deploy/content-security-policy.txt. Update iwvelando/cloud-accounts to match."
            exit 1
          fi
          test "$(header /engine.wasm content-type)" = application/wasm
          curl -fsS "$SITE_URL/" | grep -q '<title>Tangent Garden'

  # A real browser against the live site, after the deploy. No AWS credentials.
  smoke:
    needs: deploy
    # The default success() would skip this whenever `reuse` skipped the test jobs.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Reads the browser shards' package archive (see `browser`) without
      # saving one of its own.
      - id: apt
        run: |
          playwright=$(npx playwright --version | cut -d' ' -f2)
          echo "prefix=apt-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=apt-$ImageOS-$ImageVersion-playwright-$playwright" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}
      - name: Install Chromium
        timeout-minutes: 8
        run: APT_ARCHIVES="$HOME/apt-archives" .github/scripts/install-chromium.sh
      # The @smoke tests export no video, so this job needs no ffmpeg.
      - run: npx playwright test --grep @smoke
        env:
          BASE_URL: https://tangent-garden.isaacvelando.com

  # Runs on main started by a workflow (e.g. Dependabot merges) notify no one, so a
  # failure on main opens an issue, or comments on the one already open.
  alert:
    needs: [verify, deploy, smoke]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Production deploy failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - run: |
          body="Verify run $RUN_URL failed on main at $SHA. The live site may be stale or broken. Fix forward, or revert the change and let it redeploy."
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$TITLE" --body "$body"; fi
